<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager | Iqra Sayyab</title>
  <meta name="description" content="A task manager and productivity tracker with categories, due dates, filters, search and drag-and-drop. Data is saved in the browser with localStorage." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Cpath d='M18 33l10 10 18-20' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", saved || (dark ? "dark" : "light"));
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="top">
    <div class="container header-inner">
      <a href="#top" class="brand" aria-label="TaskFlow home"><span class="brand-logo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>TaskFlow</a>
      <div class="header-actions">
        <a class="header-link" href="../Task-1-Portfolio/index.html">Portfolio</a>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to dark theme">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      </div>
    </div>
  </header>

  <main class="app">
    <section class="page-head">
      <p class="eyebrow" id="todayLabel"></p>
      <h1>My Tasks</h1>
    </section>

    <section class="card summary" aria-label="Summary">
      <div class="ring-wrap" role="progressbar" aria-label="Completed tasks" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBar">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle class="ring-fill" id="progressFill" cx="60" cy="60" r="52"/>
        </svg>
        <div class="ring-text"><strong id="progressPct">0%</strong><span>done</span></div>
      </div>
      <div class="summary-info">
        <p class="summary-title" id="progressText">No tasks yet</p>
        <p class="summary-sub">Your progress across all tasks</p>
        <div class="stat-row">
          <div class="stat-item"><span>Total</span><strong id="statTotal">0</strong></div>
          <div class="stat-item"><span>Active</span><strong id="statActive">0</strong></div>
          <div class="stat-item"><span>Completed</span><strong id="statDone">0</strong></div>
          <div class="stat-item warn"><span>Overdue</span><strong id="statOverdue">0</strong></div>
        </div>
      </div>
    </section>

    <form class="card task-form" id="taskForm" novalidate>
      <input type="text" id="taskTitle" maxlength="120" placeholder="What needs to be done?" aria-label="Task title" autocomplete="off" />
      <select id="taskCategory" aria-label="Category">
        <option>Work</option><option>Personal</option><option>Study</option>
      </select>
      <input type="date" id="taskDue" aria-label="Due date" />
      <div class="form-btns">
        <button type="submit" class="btn btn-primary" id="submitBtn">Add task</button>
        <button type="button" class="btn btn-ghost" id="cancelEdit" hidden>Cancel</button>
      </div>
      <p class="form-error" id="formError" role="alert"></p>
    </form>

    <section class="toolbar" aria-label="Filters">
      <div class="tabs">
        <button class="tab" type="button" data-filter="all" aria-pressed="true">All <span id="countAll">0</span></button>
        <button class="tab" type="button" data-filter="active" aria-pressed="false">Active <span id="countActive">0</span></button>
        <button class="tab" type="button" data-filter="completed" aria-pressed="false">Completed <span id="countDone">0</span></button>
      </div>
      <input type="search" id="search" placeholder="Search tasks" aria-label="Search tasks" />
      <select id="categoryFilter" aria-label="Filter by category">
        <option value="all">All categories</option><option>Work</option><option>Personal</option><option>Study</option>
      </select>
    </section>

    <ul class="task-list" id="taskList" aria-live="polite"></ul>
    <p class="empty" id="emptyState" hidden></p>

    <footer class="list-foot">
      <span id="leftCount">0 tasks left</span>
      <span class="hint">Drag the handle to reorder</span>
      <button class="link-btn" id="clearCompleted" type="button">Clear completed</button>
    </footer>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> Iqra Sayyab. Task 2 of the Datheon Full Stack internship.</p>
      <a href="#top">Back to top</a>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
