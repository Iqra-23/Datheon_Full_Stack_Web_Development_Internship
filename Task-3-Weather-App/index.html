<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skycast | Live Weather Forecast</title>
  <meta name="description" content="Search any city for live weather, humidity, wind, pressure and a 5-day forecast. Built with the Fetch API and OpenWeatherMap." />
  <meta name="theme-color" content="#1c1917" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f59e0b'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%231c1917'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-sky="ember">
  <div class="page">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Skycast home">
        <span class="brand-logo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></span>
        Skycast
      </a>
      <div class="unit-toggle" role="group" aria-label="Temperature unit">
        <button type="button" data-unit="metric" aria-pressed="true">°C</button>
        <button type="button" data-unit="imperial" aria-pressed="false">°F</button>
      </div>
    </header>

    <form class="search" id="searchForm" role="search" novalidate>
      <div class="search-box glass">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="cityInput" placeholder="Search for a city, e.g. Lahore" aria-label="City name" autocomplete="off" maxlength="60" />
        <button type="button" class="locate" id="locateBtn" aria-label="Use my location" title="Use my location">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
        </button>
      </div>
      <button class="btn" type="submit">Search</button>
    </form>
    <p class="form-error" id="formError" role="alert"></p>
    <div class="recent" id="recent" hidden></div>

    <section class="status glass" id="status" aria-live="polite" hidden></section>

    <div id="weather" hidden>
      <section class="current glass" aria-label="Current weather">
        <div class="current-main">
          <h1 class="place"><span id="cityName"></span><small id="countryName"></small></h1>
          <p class="local-time" id="localTime"></p>
          <div class="temp-row"><span class="temp" id="temp">--</span><span class="temp-unit" id="tempUnit">°C</span></div>
          <p class="cond" id="condition"></p>
          <p class="hilo" id="hiLo"></p>
        </div>
        <div class="current-icon" id="currentIcon"></div>
      </section>

      <section class="metrics" id="metrics" aria-label="Weather details"></section>

      <section class="forecast" aria-labelledby="forecastTitle">
        <h2 id="forecastTitle">5-day forecast</h2>
        <div class="forecast-list" id="forecastList"></div>
      </section>
    </div>

    <footer class="site-footer">Weather data from <a href="https://openweathermap.org" target="_blank" rel="noopener noreferrer">OpenWeatherMap</a> · Task 3 by Iqra Sayyab</footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
